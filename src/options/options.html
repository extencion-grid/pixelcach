<!doctype html>
<html>
<head><meta charset="utf-8"><title>Opciones PixelCatch</title>
<link rel="stylesheet" href="../assets/styles/tokens.css">
<link rel="stylesheet" href="../assets/styles/design.css">
</head>
<body>
<div class="container options-wrap">
  <header class="topbar">
    <img src="../../icons/brand.png" alt="" class="brand">
    <h1 data-i18n="settings">Ajustes</h1>
  </header>

  <section class="card options-section">
    <h2 data-i18n="downloadSection">Descarga</h2>
    <label class="field">
      <span data-i18n="defaultFormat">Formato por defecto</span>
      <select id="defaultFormat" class="input">
        <option value="original">Original (sin convertir, más rápido)</option>
        <option value="png">PNG</option>
        <option value="jpg">JPG</option>
        <option value="webp">WebP</option>
        <option value="avif">AVIF</option>
      </select>
    </label>
    <label class="field">
      <span data-i18n="nameTemplate">Plantilla de nombre</span>
      <input id="nameTemplate" class="input" value="{domain}-{date}-{index}">
    </label>
    <label class="field">
      <span data-i18n="concurrency">Descargas en paralelo</span>
      <input id="downloadConcurrency" class="input input-narrow" type="number" min="1" max="8" value="4">
    </label>
  </section>

  <section class="card options-section">
    <h2 data-i18n="detectionSection">Detección</h2>
    <label class="field">
      <span data-i18n="minSize">Tamaño mínimo (px)</span>
      <input id="minSize" class="input input-narrow" type="number" min="0" value="0">
    </label>
    <label class="check-row">
      <input id="detectBackgrounds" type="checkbox">
      <span data-i18n="backgroundScan">Buscar fondos (CSS)</span>
    </label>
    <label class="check-row">
      <input id="detectResources" type="checkbox">
      <span data-i18n="resourceScan">Detectar imágenes por resource timing</span>
    </label>
  </section>

  <section class="card options-section">
    <h2 data-i18n="advancedSection">Avanzado</h2>
    <label class="check-row">
      <input id="debugEnabled" type="checkbox">
      <span data-i18n="debugMode">Modo debug</span>
    </label>
    <p class="muted small">
      <a href="#" id="shortcuts" data-i18n="shortcutsLink">Reasignar atajos (chrome://extensions/shortcuts)</a>
    </p>
  </section>

  <div class="options-footer">
    <button id="save" class="btn btn-primary" data-i18n="save">Guardar</button>
    <span id="status" class="options-status"></span>
  </div>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
